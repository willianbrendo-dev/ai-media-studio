map $http_referer $next_upstream {
    default "127.0.0.1:3107";
    "~*/app/higgsfield" "127.0.0.1:3020";
    "~*/app/openhiggsfield" "127.0.0.1:3020";
    "~*/app/supoclip" "127.0.0.1:3107";
    "~*/app/openseo" "127.0.0.1:3040";
}

map $http_authorization $supoclip_upstream_auth {
    default $http_authorization;
    "~^Bearer st_" "";
    "~^Basic " "";
}

server {
    server_name 187.77.202.176.sslip.io 187.77.202.176;

    client_max_body_size 512M;

    location = /_check_studio_token {
        internal;
        if ($request_method = OPTIONS) {
            return 200;
        }
        if ($http_authorization = "Bearer st_<REPLACE_WITH_VPS_PANEL_TOKEN>") {
            return 200;
        }
        if ($http_x_studio_token = "st_<REPLACE_WITH_VPS_PANEL_TOKEN>") {
            return 200;
        }
        return 401;
    }

    location @stack_standby_portal {
        rewrite ^ /api/stack-standby-view break;
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 1. MoneyPrinterTurbo (:8501 Streamlit baseUrlPath=/app/moneyprinter) ---
    location = /app/moneyprinter {
        return 301 /app/moneyprinter/;
    }

    location /app/moneyprinter/ {
        satisfy any;
        auth_request /_check_studio_token;
        auth_basic "AI Media Studio Cloud VPS (Acesso Restrito)";
        auth_basic_user_file /etc/nginx/.htpasswd-studio;

        proxy_pass http://127.0.0.1:8501;
        proxy_intercept_errors on;
        error_page 502 503 504 =200 @stack_standby_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;

        sub_filter_once off;
        sub_filter '</head>' '<style>@media(max-width:640px){.block-container{padding:1rem .75rem 3rem!important}section[data-testid="stSidebar"]{max-width:85vw!important}button{min-height:44px!important}}</style></head>';
    }

