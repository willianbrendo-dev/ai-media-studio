<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d4f63;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7b8a9a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0aebf;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffe082;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#ffc107;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffc107;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="monolithGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#555555;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b6b6b;stop-opacity:1" />
    </linearGradient>
    <filter id="mistEffect">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.5
                                                   0 1 0 0 0.5
                                                   0 0 1 0 0.5
                                                   0 0 0 1 0" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="1024" height="1024" fill="url(#skyGradient)" />

  <!-- Sun Glow -->
  <circle cx="512" cy="150" r="150" fill="url(#sunGlow)" filter="url(#mistEffect)" />

  <!-- Fjord Walls -->
  <polygon points="0,500 0,1024 250,1024 250,600 350,800 450,600 550,900 650,700 750,1000 850,750 950,1024 1024,1024 1024,500" fill="url(#monolithGradient)" opacity="0.9"/>

  <!-- Monolith -->
  <rect x="380" y="100" width="260" height="700" fill="url(#monolithGradient)" />
  <rect x="400" y="50" width="220" height="750" fill="url(#monolithGradient)" opacity="0.95"/>

  <!-- Volumetric Light Beams -->
  <g opacity="0.3">
    <polygon points="490,0 530,0 450,300" fill="#ffeb3b" transform="rotate(-10 512 150)" />
    <polygon points="490,0 530,0 450,300" fill="#ffeb3b" transform="rotate(10 512 150)" />
    <polygon points="490,0 530,0 450,300" fill="#ffeb3b" transform="rotate(30 512 150)" />
    <polygon points="490,0 530,0 450,300" fill="#ffeb3b" transform="rotate(-30 512 150)" />
    <polygon points="490,0 530,0 450,300" fill="#ffeb3b" transform="rotate(50 512 150)" />
    <polygon points="490,0 530,0 450,300" fill="#ffeb3b" transform="rotate(-50 512 150)" />
  </g>

  <!-- Mist Layer -->
  <rect width="1024" height="1024" fill="rgba(200,200,200,0.2)" filter="url(#mistEffect)" />

  <!-- Water Surface -->
  <rect y="780" width="1024" height="244" fill="url(#waterGradient)" opacity="0.8"/>

  <!-- Reflections on Water -->
  <g opacity="0.1">
    <rect x="380" y="780" width="260" height="244" fill="url(#monolithGradient)" transform="scale(1,-1) translate(0,-1564)" />
    <rect x="400" y="780" width="220" height="244" fill="url(#monolithGradient)" transform="scale(1,-1) translate(0,-1564)" opacity="0.95"/>
  </g>

  <!-- Subtle Mist on Water -->
  <rect y="780" width="1024" height="244" fill="rgba(220,220,220,0.1)" filter="url(#mistEffect)" />

</svg>